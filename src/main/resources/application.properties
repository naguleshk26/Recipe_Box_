# ==================================================
# RecipeBox - Application Configuration
# ==================================================

# Application Name
spring.application.name=recipebox

# Server Port
server.port=8080

# ==================================================
# Database Configuration (MySQL)
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:3306/recipebox_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

# IMPORTANT: Replace YOUR_PASSWORD with your MySQL root password (e.g. nagul26@ or your local MySQL password)
# You can change YOUR_PASSWORD directly below or supply DB_PASSWORD environment variable
spring.datasource.password=${DB_PASSWORD:nagul26@}

# ==================================================
# JPA / Hibernate Settings
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==================================================
# Swagger / OpenAPI 3 Configuration
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
